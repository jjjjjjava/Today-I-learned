notes: |
  学习来源：04. 学习_音视频/03. 音视频_OpenGL_02.使用OpenGL渲染视频画面.md
  对应章节：3.4坐标系统与变化 + 3.5着色器中矩阵应用详解
  前置：022正交投影矩阵 + 019GLSL架构（变量类型、着色器编译）
  核心内容：
    A. 坐标系转换（3.4）：
    1. 三个坐标系（020已学）：
       - 屏幕坐标系：[0, width/height]，原点左上角，Y向下
       - 顶点坐标系（NDC）：[-1, 1]，原点中心，Y向上
       - 纹理坐标系：[0, 1]，原点左下角
    2. 完整转换链路：屏幕坐标→NDC坐标→视频坐标→像素坐标
    3. 屏幕→NDC：
       - ndcX = (screenX/screenWidth) × 2 - 1
       - ndcY = -((screenY/screenHeight) × 2 - 1)
       - Y轴取反：Android Y向下，OpenGL Y向上
    4. NDC→视频坐标（逆矩阵）：
       - orthoM让画面缩小0.28倍，反过来要×3.555还原
       - videoY = ndcY × (1/orthoScale) = ndcY × 3.555
       - 超出[-1,1]则点在黑边上
    5. 视频坐标→像素坐标：
       - pixelX = (videoX + 1) / 2 × videoWidth
       - pixelY = (1 - videoY) / 2 × videoHeight（又一次Y翻转）
       - 第二次Y翻转：NDC Y向上，视频像素Y向下
       - 这一步仅在需要像素级操作（截图/人脸检测）时才需要
    B. CPU→GPU矩阵传递（3.5）：
    6. 三步流程：
       - 算矩阵：Matrix.orthoM() → FloatArray(16)
       - 查槽位：glGetUniformLocation(program, "uMatrix") → 整数Location
       - 上传：glUniformMatrix4fv(location, 1, false, matrix, 0)
    7. GPU端接收：
       - uniform mat4 uMatrix; 接收矩阵
       - gl_Position = aPosition * uMatrix; 每个顶点乘以矩阵
       - GPU多核并行，4个顶点同时计算
    8. 着色器完整变量：
       - attribute vec4 aPosition → 顶点坐标（per-vertex）
       - attribute vec2 aCoordinate → 纹理坐标（per-vertex）
       - uniform mat4 uMatrix → 变换矩阵（全局共享）
       - varying vec2 vCoordinate → 传递给片元着色器（经光栅化插值）

