  ## 讲解后新学到的知识
  - **H.264 Profile**：Baseline无B帧无CABAC(低延迟RTC) / Main有B帧有CABAC / High加8x8变换(主流)
  - **NAL单元**：H.264码流的包装单位，1字节Header含5bit type(7=SPS,8=PPS,5=IDR,1=non-IDR)
  - **Annex-B vs AVCC**：起始码(00 00 00 01)分隔 vs 长度前缀分隔；Annex-B流式友好(TS/RTP)，AVCC随机访问友好(MP4)；SPS/PPS在AVCC中存于avcC box而非码流中
  - **ADTS vs ADIF**：AAC版的Annex-B vs AVCC；ADTS每帧带7字节同步头(流式传输)，ADIF头部一次性(文件存储)
  - **Fast Start**：moov前置到文件头，下载几KB就能开始播放；默认moov在尾部需下载完整文件

