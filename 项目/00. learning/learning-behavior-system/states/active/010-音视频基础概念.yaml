  ## 面试要点详细版

  ### NAL单元与码流格式

  H.264编码输出是一串连续的二进制数据，里面既有解码配置信息（SPS/PPS），又有实际帧数据（IDR/P/B），需要一种方式来区分。这就是NAL（Network Abstraction Layer，网络抽象层）协议。

  编码器输出被打包成一个个NALU（NAL Unit），每个NALU包含header和payload。header中有type字段：
  - type=7 → SPS（Sequence Parameter Set，序列参数集：分辨率、profile、level）
  - type=8 → PPS（Picture Parameter Set，图像参数集：量化参数、熵编码模式）
  - type=5 → IDR帧（Instantaneous Decoder Refresh）
  - type=1 → 非IDR帧（P/B帧）
  SPS+PPS就是MediaCodec中的CSD（csd-0和csd-1）。

  NALU长度不一，两种分隔方案：

  Annex-B（起始码分隔）：每个NALU前放固定分隔符00 00 00 01，从任意位置扫描都能找到分隔符开始解析。适合直播、TS流、RTP网络传输。

  AVCC（长度前缀分隔）：每个NALU前放4字节长度值，知道长度就能直接跳过。SPS/PPS不在码流中，存在MP4容器的avcC box里。适合需要频繁seek的点播/流媒体（MP4封装）。代价是必须先下载moov才能解码。

  这引出Fast Start：默认moov在文件末尾，网络播放需下载完整文件。moov前置后下载几KB即可开始播放。ffmpeg用-movflags faststart配置。

  ### H.264 Profile

  Profile是编码工具集的三个等级：
  - Baseline：只有I帧和P帧，无B帧，无CABAC（只有CAVLC）。编解码延迟最低。适合视频通话、低延迟直播。
  - Main：引入B帧+CABAC熵编码（比CAVLC压缩率高10~15%）。适合电视广播、标清视频。
  - High：在Main基础上加8x8变换、量化缩放矩阵。压缩率最高，解码性能要求最高。适合高清/4K、蓝光、流媒体主流选择。
  压缩效率：Baseline < Main < High，复杂度也递增。

  ### ADTS vs ADIF

  AAC码流的两种打包格式，与H.264的Annex-B vs AVCC是同一问题在音频领域的翻版：
  - ADTS（Audio Data Transport Stream）：每帧带7字节同步头（含同步字0xFFF、Profile、采样率、声道数、帧长度），每帧自描述可独立解码。适合直播、网络流、TS封装。T=Transport记忆。
  - ADIF（Audio Data Interchange Format）：头部信息只在文件开头写一次，更紧凑但必须从头读。适合本地文件存储。I=Interchange记忆。
  实际MP4中两者都不用，AAC参数存在esds box中，和H.264的avcC思路一致。

  ### moov box内部结构补充

  stbl（Sample Table）是moov的核心索引表：
  - stsd：编码参数（avcC box存SPS/PPS）
  - stts：时间→样本映射（DTS）
  - ctts：CTS偏移（PTS = DTS + CTS）
  - stss：关键帧索引（哪些帧是IDR → seek用）
  - stsz：每个样本的大小
  - stco：chunk在文件中的偏移量（指向mdat中的位置）
  没有stbl就无法seek，也无法知道该读mdat的哪段数据。

  ## 下次复习重点考察
  - ADTS vs ADIF：T=Transport(每帧带头,流式) / I=Interchange(头部一次,文件)，不要记反
  - NAL逻辑链能否完整串出：为什么需要→type区分→分隔问题→两种方案→Fast Start
  - Profile三档核心差异（Baseline无B帧无CABAC）
