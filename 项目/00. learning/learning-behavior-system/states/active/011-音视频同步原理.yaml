  评估 Q&A 记录（有效 5 题，顺序按卡片结构）：
  - Q1 [同步·真题·0voice] 何为音视频同步，音视频同步是什么标准？
    → excellent | 初答音频PTS基准方案（丢帧/渲染/延迟三档策略），追问后答出"系统时间=解耦"本质
    （两者独立对系统时间做判断，而不是视频强耦合音频）
  - Q2 [同步·真题·0voice] DTS 与 PTS 共同点？
    → good | 初答偏题（答成差异+IBP编解码顺序+Baseline Profile 串联010卡片），追问后答对共同点
    （都是时间戳、都标记帧处理顺序、无B帧时相等）
  - Q3 [同步·真题·0voice] 播放器暂停、快进快退、seek、逐帧、变速怎么实现？
    → ok | 切到音频PTS基准答题：暂停无需校准✅ / seek流程flush+IDR+更新PTS✅ / 变速简化为丢帧
    用户主动声明"系统时间校准记公式即可"→ 列入 weak_points
  - Q4 [Extractor·真题·CSDN] mediaExtractor 中音频和视频数据是如何排列的？
    → good | 卡片scope内答全：交替排列 / MP4 moov+mdat / 轨道描述+帧映射表 / 查STBL表读取
    描述了AVCC读取流程（读长度前缀→读帧数据）
    超scope延伸内容有3处小偏差（MP4存raw AAC非ADTS / MediaExtractor不解析NAL / 交织是chunk-based），纠偏后吸收
  - Q5 [Extractor·真题·CSDN] mediaExtractor.getSampleTrackIndex() 是随机返回音频和视频轨道的 index 吗？
    → 跳过（out of scope）| 此API适用于"单extractor+多track"架构（如remux场景），
    011项目用"双extractor+单track"架构，永远用不到。筛题失误
  - Q6 [Extractor·真题·CSDN] readSampleData 方法中 offset 有什么用？
    → good | 一句话答对：写入 ByteBuffer 的起始偏移位置

  评估中的新收获（扩展知识边界）：
  1. 音频PTS基准下的变速机制：
     - 专业做法：SoundTouch 变速不变调处理音频 → audioPTS 推进速度天然加倍/减半 → 视频 sleepRender 自动跟上
     - 业余做法（音频不变速只丢视频帧）会导致音画不同步
     - 关键洞察：音频是同步的"心跳"，变速 = 心跳变快/变慢
  2. 系统时间 vs 音频 PTS 基准的真正权衡：
     - 学习项目用系统时间：公式透明可推导、纯视频场景同样适用、解耦容灾
     - 生产项目用音频 PTS：变速天然支持、业界标准（ffplay/ijkplayer/ExoPlayer 默认）
     - 011 项目定位是学习型 demo，选系统时间合理
  3. MP4 容器细节（来自 Q4 纠偏）：
     - 交织模式：chunk-based 时间块交织（每 chunk 0.5~1 秒），非严格逐帧交替，为了减少磁头寻道
     - 视频存储格式：AVCC（Length-Prefixed），不是 Annex-B NALU 起始码
     - 音频存储格式：raw AAC 帧，不是 ADTS header 格式
     - stbl 子 box 定位链：stsc（sample→chunk）+ stco（chunk偏移）+ stsz（sample大小）
     - MediaExtractor 职责边界：只做查表+读取，不解析 NAL header（那是 MediaCodec 的工作）

  下次复习重点考察：
  - 【核心】系统时间基准下 mStartTimeForSync 重置公式的推导（暂停后为什么不重置会疯狂追帧？seek后的 PTS 不连续如何对齐？）
  - 【扩展】能否描述 MP4 的 stbl 子 box 定位链（帧号 → chunk → 文件偏移）
  - 【串联】能否讲清音频 PTS 基准 vs 系统时间基准在变速场景下的差异
