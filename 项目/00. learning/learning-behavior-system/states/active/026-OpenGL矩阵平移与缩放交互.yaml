notes: |
  学习来源：04. 学习_音视频/03. 音视频_OpenGL_03.使用OpenGL渲染画中画.md
  对应章节：3.4上层视频平移 + 3.5上层视频缩放
  前置：022正交投影矩阵 + 023坐标系转换
  核心内容：
    A. 平移（3.4）：
    1. 平移矩阵原理：4×4矩阵第4列存储Tx/Ty/Tz，齐次坐标w=1使乘法变加法
    2. 触摸→平移参数的三次转换：
       - 手指滑动px → 归一化（÷屏幕尺寸）→ 屏幕比例
       - 屏幕比例 → × ratio × 2 → 世界坐标距离
       - 世界坐标距离 → Matrix.translateM → 修改正交矩阵第4列（索引12、13）
    3. 为什么 × ratio × 2：
       - ratio是NDC扩大倍数（如heightRatio=3.555）
       - × 2是因为总范围 = [-ratio, ratio] = 2×ratio
    4. -dy：Android Y向下，OpenGL Y向上，取反
    5. translateM不创建新矩阵，直接修改现有正交矩阵
       m[13] += m[5] × sy，投影系数自动参与运算
    6. 代码：Matrix.translateM(mMatrix, 0, dx*mWidthRatio*2, -dy*mHeightRatio*2, 0f)
    B. 缩放（3.5）：
    7. 正交矩阵本质就是缩放矩阵（对角线 = 缩放系数）
    8. 用户缩放 = 在正交矩阵基础上累积乘
       scaleM → m[0] *= sx, m[5] *= sy
    9. ScaleGestureDetector检测双指捏合，scaleFactor = 新距离/旧距离
    10. 缩放后必须更新ratio：
        - mWidthRatio /= sx, mHeightRatio /= sy
        - 原因：矩阵缩小→ratio增大，保证translate算出的距离和缩小后的画面同步
        - 不更新→手指和画面不同步
    C. ratio的角色：
    11. 存储在VideoDrawer中：mWidthRatio, mHeightRatio
    12. initDefMatrix时计算初始值
    13. translate时用它算世界坐标距离
    14. scale时必须同步更新
    15. 始终保持：矩阵缩放系数 × ratio = 常量
    D. 触摸事件分发：
    16. 当前项目简化处理：只给上层Drawer注册触摸
    17. 完整方案：hitTest（023逆矩阵判断）+ 从上往下遍历Drawer列表
