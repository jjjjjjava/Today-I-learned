  核心理解（2026-04-01）：
    整体是两套渲染逻辑，中间难点是资源的切换和挂载：
    逻辑A：每500ms → 渲染到自定义FBO（冻结帧快照）
    逻辑B：每帧     → 双纹理混合渲染上屏（实时帧 + 冻结帧）

  1. FBO本质：
     - 不存数据，只持有attachment索引（颜色/深度/模板）
     - 默认FBO(0)：eglMakeCurrent时color attachment → GraphicBuffer → 屏幕
     - 自定义FBO：color attachment → 开发者指定的Texture → GPU内部留存

  2. 三方案对比（多层滤镜场景）：
     - 方案A（无FBO）：渲染到屏幕→读回CPU→上传GPU，每层一次CPU↔GPU传输
     - 方案B（EGL离屏/SurfaceTexture）：零拷贝但有BufferQueue锁+CPU futex唤醒开销
     - 方案C（FBO）：GPU内部寄存器指针切换，几乎零开销，代价是多占一块显存

  3. FBO 5步API：
     step1 createFBOTexture：
       glGenTextures分配ID → glBindTexture绑到默认纹理单元（只为配置）
       → glTexImage2D(null) 分配空显存（白纸内存）
       → 设过滤参数 → glBindTexture(0)解绑防误改

     step2 createFrameBuffer：
       glGenFramebuffers创建空FBO，此时无任何attachment

     step3 bindFBO（建立连接）：
       glBindFramebuffer激活FBO → glFramebufferTexture2D把纹理挂到GL_COLOR_ATTACHMENT0
       之后所有渲染输出 → 写入该纹理显存

     step4 unbindFBO：
       glBindFramebuffer(GL_NONE) 恢复默认FBO → 渲染目标回到屏幕

     step5 deleteFBO：
       解绑 → glDeleteFramebuffers → 解绑纹理 → glDeleteTextures

  4. 灵魂出窍代码执行流：

     draw() 主流程：
       updateFBO()           → 每500ms冻结一帧到mSoulTextureId
       activateSoulTexture() → mSoulTextureId绑到纹理单元1
       activateDefTexture()  → OES实时帧绑到纹理单元0
       updateTexture()       → updateTexImage()刷新OES最新帧
       doDraw()              → 双纹理混合上屏

     updateFBO() 内部：
       bindFBO(mSoulFrameBuffer, mSoulTextureId)
       configFboViewport() → 单位矩阵 + 翻转顶点 + viewport=视频尺寸 + 清屏
       activateDefTexture() + updateTexture()  ← 输入：实时帧
       doDraw()  ← 输出：写入FBO纹理（drawFbo=1，shader直接写色不混合）
       unbindFBO() + configDefViewport()

  5. configFboViewport三要素：
     - 单位矩阵：FBO纹理尺寸=视频尺寸，无需宽高比校正
     - mReserveVertexCoors（Y翻转）：
       纹理坐标和NDC方向一致（原点左下，Y向上）
       渲染到屏幕时EGL自动翻转（弥补屏幕Y向下的差异），FBO没有这个翻转
       所以FBO里的图像方向和屏幕显示的方向相反，需要手动翻转顶点坐标补偿
       不翻转则冻结帧倒置，后续采样时是倒图
     - glViewport(0,0,videoW,videoH)：渲染区域匹配FBO纹理尺寸

  6. 着色器双纹理混合：
     - drawFbo flag（uniform int）：
       drawFbo=1（渲染到FBO）→ 直接写色 gl_FragColor=vec4(color.rgb, inAlpha)
       drawFbo=0（渲染到屏幕）→ 混合    gl_FragColor=color*(1-alpha)+soulMask*alpha
     - progress自动增大：
       每帧doDraw()计算 progress=(currentTime-mModifyTime)/500f，帧回调驱动
       mModifyTime每500ms重置 → progress自动0→1循环
     - scale放大原理（坐标收缩）：
       soulX = 0.5 + (vCoordinate.x - 0.5) / scale
       scale=1.5时屏幕[0,1]只采样纹理[0.167,0.833]中心区域，拉伸到全屏=放大
     - alpha消散：alpha = 0.6 * (1.0 - progress)，scale越大alpha越小

