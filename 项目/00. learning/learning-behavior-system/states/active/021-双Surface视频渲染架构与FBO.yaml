notes: |
  学习来源：04. 学习_音视频/03. 音视频_OpenGL_02.使用OpenGL渲染视频画面.md
  对应章节：3.1原理分析 + 3.2实际代码
  前置：017零拷贝图形管线 + 018渲染管线基础 + 019GLSL架构 + 020纹理系统
  核心内容：
    1. 为什么需要双Surface：
       - 静态图片：texImage2D一次性上传，可行
       - 视频60fps：每帧8MB，480MB/s总线传输+频繁GC，不可行
       - 解决方案：零拷贝 + 双Surface架构
    2. 双Surface角色：
       - Surface1（输入）：MediaCodec输出→BufferQueue→SurfaceTexture→OES纹理，GPU的数据来源
       - Surface2（输出）：GLSurfaceView自带，EGL绑定为默认帧缓冲，GPU渲染结果→swap→SurfaceFlinger→屏幕
       - 本质：Surface1是OpenGL的输入，Surface2是OpenGL的输出，不能合一
    3. 四阶段渲染流程：
       - 阶段一：MediaCodec硬件解码→写入Surface1的GraphicBuffer
       - 阶段二：SurfaceTexture.updateTexImage()→EGLImage→绑定OES纹理（零拷贝）
       - 阶段三：GPU执行GLSL着色器，从OES纹理采样，渲染到Surface2帧缓冲
       - 阶段四：eglSwapBuffers→Binder→SurfaceFlinger合成→屏幕
    4. Surface1创建流程（涉及跨线程）：
       - GL线程：glGenTextures→new SurfaceTexture(texId)→callback传出
       - 主线程：收到SurfaceTexture→new Surface(st)→mediaCodec.configure(surface)
       - 为什么需要回调：SurfaceTexture必须在GL线程创建（绑定纹理），MediaCodec在主线程配置
    5. Surface2创建：GLSurfaceView自动完成，内部通过eglCreateWindowSurface绑定
    6. 代码差异（vs静态图片）：
       - 片元着色器：#extension GL_OES_EGL_image_external + samplerExternalOES
       - 多了SurfaceTexture初始化和回调传递
       - onDrawFrame中调用updateTexImage()更新每帧
    7. FBO离屏渲染：
       - FBO是容器（画架），纹理附件是存储（画布）
       - 创建：glGenFramebuffers→glGenTextures→glFramebufferTexture2D挂载
       - 切换：glBindFramebuffer(fboId)画到FBO，glBindFramebuffer(0)画到屏幕
       - FBO输出到纹理（GPU内部，不上屏），Surface2输出到屏幕（跨进程）
       - 滤镜链：OES→FBO1→FBO2→...→默认帧缓冲(Surface2)→屏幕
    8. 移动端统一内存架构（UMA）：
       - 手机GPU集成在SoC中，和CPU共用同一块物理RAM，无独立VRAM
       - GraphicBuffer通过ION/gralloc分配，是物理内存中的跨进程跨硬件共享缓冲区
       - 零拷贝成立原因：解码器和GPU访问的是同一块物理内存

