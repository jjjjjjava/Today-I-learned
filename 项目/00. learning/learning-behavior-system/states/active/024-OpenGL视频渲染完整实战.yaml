  前置条件：必须先完成以下全部条目的学习和复习，才能激活本条
    - 009 MediaCodec编解码原理
    - 010 音视频基础概念
    - 011 音视频同步原理
    - 014 音视频重封装MP4
    - 017 OpenGL ES零拷贝图形管线
    - 018 OpenGL ES渲染管线基础
    - 019 GLSL与Android渲染架构
    - 020 OpenGL ES纹理系统与绘制模式
    - 021 双Surface视频渲染架构与FBO
    - 022 正交投影矩阵与视频比例适配
