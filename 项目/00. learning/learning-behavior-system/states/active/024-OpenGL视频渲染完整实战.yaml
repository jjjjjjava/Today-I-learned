  核心内容：
    完整代码架构：
      - IDrawer接口抽象（draw/setTextureID/getSurfaceTexture/release）
      - VideoDrawer实现（5步渲染流程）
      - SimpleRender驱动（GLSurfaceView.Renderer三个回调）
      - Activity组装（Drawer+Renderer+Decoder连接）
    代码执行流（3线程协作）：
      1. 主线程：new VideoDrawer → initPos → 注册SurfaceTexture回调 → setRenderer启动GL线程
      2. GL线程：onSurfaceCreated → glGenTextures → setTextureID → new SurfaceTexture → 回调传出
      3. 主线程：收到回调 → new Surface(st) → MediaCodec.configure(surface) → 启动解码线程
      4. GL线程：onSurfaceChanged → glViewport + setWorldSize
      5. GL线程循环：onDrawFrame → initDefMatrix(一次) → createGLPrg(一次) → activateTexture → updateTexImage → doDraw → swapBuffers
    三阶段演进：
      - 阶段一：基础骨架（5步渲染流程，FloatBuffer，着色器编译）
      - 阶段二：接入视频解码（SurfaceTexture回调跨线程传递，OES纹理）
      - 阶段三：正交投影矩阵（比例适配，矩阵CPU→GPU传递）
    关键代码细节：
      - FloatBuffer用ByteBuffer.allocateDirect分配堆外内存（OpenGL C底层需要）
      - createGLPrg有if保护只编译一次，useProgram每帧执行
      - glUniform1i把纹理单元编号传给着色器sampler
      - glVertexAttribPointer第二个参数2表示xy两个分量
      - release必须手动调用，GPU资源不受GC管理
    详细代码执行流：
      初始化阶段（主线程）：
        ① new VideoDrawer() → init { initPos() } → 分配FloatBuffer，灌入顶点坐标和纹理坐标
           此时：mTextureId=-1, mProgram=-1, mSurfaceTexture=null
        ② drawer.getSurfaceTexture { cb } → 只是存下lambda到mSftCb，还没执行
        ③ gl_surface.setRenderer(SimpleRender(drawer)) → 创建GL线程，创建EGL上下文，绑定Surface2
      GL线程初始化阶段：
        ④ onSurfaceCreated → glGenTextures(1, ids, 0) → 从纹理池申请一个ID（如1）
        ⑤ mDrawer.setTextureID(1) 进入VideoDrawer：
           ⑥ mTextureId = 1
           ⑦ mSurfaceTexture = SurfaceTexture(1)  用纹理ID创建SurfaceTexture
           ⑧ mSftCb?.invoke(mSurfaceTexture!!)     触发回调，传出SurfaceTexture
      回调触发（回到主线程）：
        ⑨ lambda执行：new Surface(st) 用SurfaceTexture创建Surface1（包装producer端）
        ⑩ initPlayer(surface)：
           ⑪ new VideoDecoder(path, null, sf) → 内部MediaCodec.configure(format, sf, ...)
              MediaCodec拿到Surface1，解码输出直写GraphicBuffer
           ⑫ new AudioDecoder(path)
           ⑬ videoDecoder.goOn() + audioDecoder.goOn() → 启动解码
      GL线程继续初始化：
        ⑭ onSurfaceChanged → glViewport(0, 0, 1080, 1920) 设置视口
        ⑮ mDrawer.setWorldSize(1080, 1920) → mWorldWidth=1080, mWorldHeight=1920
      每帧渲染循环（GL线程，反复执行）：
        ⑯ onDrawFrame → glClear 清屏
        ⑰ mDrawer.draw() 进入VideoDrawer.draw()：
           ⑱ initDefMatrix()（只算一次）
              originRatio=videoW/videoH, worldRatio=screenW/screenH
              比较后调用Matrix.orthoM设置正交矩阵，之后mMatrix!=null直接return
           ⑲ createGLPrg()（只编译一次）
              首次：loadShader×2 → glCreateProgram → glAttachShader×2 → glLinkProgram
              → glGetAttribLocation("aPosition") → mVertexPosHandler
              → glGetAttribLocation("aCoordinate") → mTexturePosHandler
              → glGetUniformLocation("uTexture") → mTextureHandler
              → glGetUniformLocation("uMatrix") → mVertexMatrixHandler
              之后跳过编译，每帧执行glUseProgram(mProgram)
           ⑳ activateTexture()
              → glActiveTexture(GL_TEXTURE0) 激活0号纹理单元
              → glBindTexture(OES, mTextureId) 绑定OES纹理到0号
              → glUniform1i(mTextureHandler, 0) 告诉着色器去0号单元取
              → glTexParameterf×4 配置缩放滤波+边缘处理
           ㉑ updateTexture()
              → mSurfaceTexture.updateTexImage()
              → 从BufferQueue取最新帧 → EGLImage → 绑定到OES纹理
              → 无新帧则不做任何事
           ㉒ doDraw()
              → glEnableVertexAttribArray×2 启用两个属性通道
              → glUniformMatrix4fv(矩阵handler, 1, false, mMatrix, 0) 上传正交矩阵
              → glVertexAttribPointer(顶点handler, 2, FLOAT, false, 0, mVertexBuffer) 绑定顶点数据
              → glVertexAttribPointer(纹理handler, 2, FLOAT, false, 0, mTextureBuffer) 绑定纹理坐标
              → glDrawArrays(TRIANGLE_STRIP, 0, 4) 绘制4个顶点
        绘制后GLSurfaceView自动调用eglSwapBuffers
        → 交换前后缓冲 → Binder通知SurfaceFlinger → 合成+硬件显示 → 一帧完成
      三线程协作时序图：
        主线程                     GL线程                     解码线程
          ├─ new VideoDrawer         │                          │
          ├─ initPos                 │                          │
          ├─ getSurfaceTexture(cb)   │                          │
          ├─ setRenderer ──────────→ │                          │
          │                          ├─ onSurfaceCreated        │
          │                          ├─ glGenTextures           │
          │                          ├─ setTextureID(id)        │
          │                          │  ├─ new SurfaceTexture   │
          │  ←─ cb.invoke(st) ──── │  └─ 触发回调              │
          ├─ new Surface(st)         │                          │
          ├─ VideoDecoder(sf) ─────│──────────────────────────→ │
          ├─ goOn()                  │                          ├─ MediaCodec.start()
          │                          ├─ onSurfaceChanged        │
          │                          ├─ setWorldSize            │
          │                          │                          │
          │                          ├─ onDrawFrame ←────────── ┤ 解码写入GraphicBuffer
          │                          │  ├─ initDefMatrix        │
          │                          │  ├─ createGLPrg          │
          │                          │  ├─ activateTexture      │
          │                          │  ├─ updateTexImage       │
          │                          │  ├─ doDraw               │
          │                          │  └─ swapBuffers→屏幕     │
          │                          ├─ onDrawFrame（循环）      │

