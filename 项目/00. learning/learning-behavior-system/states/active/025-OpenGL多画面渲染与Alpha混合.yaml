notes: |
  学习来源：04. 学习_音视频/03. 音视频_OpenGL_03.使用OpenGL渲染画中画.md
  对应章节：3.2架构设计 + 3.3多画面渲染+半透明效果
  前置：021双Surface架构 + 024完整实战
  核心内容：
    1. SimpleRender改造：单Drawer → Drawer列表
       - 批量createTextureIds(drawers.size)，每个Drawer分配独立纹理ID
       - 遍历通知setWorldSize，遍历调用draw()
       - addDrawer顺序 = 绘制顺序 = 层叠关系（先添加在底层）
    2. 多视频架构本质：N个视频 = N套完整管线
       - MediaCodec₁→Surface₁→SurfaceTexture₁→OES纹理₁→Drawer₁
       - MediaCodec₂→Surface₂→SurfaceTexture₂→OES纹理₂→Drawer₂
    3. OpenGL混合模式：
       - 默认不混合，后绘制直接覆盖，alpha无效
       - 开启：glEnable(GL_BLEND)（通用开关函数，参数决定开什么）
       - 配置公式：glBlendFunc(GL_SRC_ALPHA, GL_ONE_MINUS_SRC_ALPHA)
       - 公式：最终 = src × alpha + dst × (1-alpha)
       - 混合在GPU硬件完成（blending unit），几乎零额外开销
       - 多级混合不断累积：每次都是当前片元 vs Surface2已有内容
    4. Alpha传递链路（代码中的实现）：
       - CPU: glVertexAttrib1f(handler, 0.5) → attribute float alpha
       - 顶点着色器: inAlpha = alpha → varying传递
       - 片元着色器: gl_FragColor = vec4(color.rgb, inAlpha) → 直接替换alpha通道
       - 改进方案：用uniform更合理（alpha是全局常量）
         glGetUniformLocation + glUniform1f → 片元着色器中 color.a * uAlpha
    5. glVertexAttrib1f vs glVertexAttribPointer：
       - Attrib1f：传单个常量，所有顶点共用（适合alpha）
       - AttribPointer：传数组，每个顶点读一个（适合坐标）

