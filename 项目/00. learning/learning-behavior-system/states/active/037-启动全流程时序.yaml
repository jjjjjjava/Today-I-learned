  - "[阶段4][⚠️ 术语] LAUNCH_ACTIVITY 消息名：曾说成 Create_Activity ✓×1 (最近:2026-05-09)"
  - "[阶段4] performLaunchActivity 5步顺序：①createContext ②反射 newActivity ③Activity.attach（绑 Context + new PhoneWindow）④setTheme ⑤Activity.onCreate ✗ (2026-05-09 漏 setTheme，用户认为不关键)"
  - "[阶段4] setContentView 三阶段：①installDecor（new DecorView + 选系统布局模板 + 找 mContentParent）②LayoutInflater.inflate（解析 XML + 反射 new View + addView）③返回（View 树挂好但不跑 measure）✗ (2026-05-09 第3阶段表述偏差：把'未连 ViewRootImpl/WMS'误说为'未连 PhoneWindow')"
  - "[阶段4][反直觉考点] setContentView 不跑 measure：之后 view.width == 0，真正 measure 在阶段5的 performTraversals ✓×1 (最近:2026-05-09)"
  - "[阶段4][反直觉考点] onCreate/onStart/onResume 在同一条 LAUNCH_ACTIVITY 消息内连续执行，中间 Looper 不取新消息 → onCreate 里 handler.post 的任务要等 onResume 跑完后才执行 ✓×1 (最近:2026-05-09，但未主动说出 why)"

  # ========== 阶段5：渲染管线 ==========
  - "[阶段5][❌易错] performTraversals 不走 Binder：在应用进程主线程的 ViewRootImpl 直接执行。Vsync 通过 Choreographer 接收（不是中断），监听 SurfaceFlinger 推送的 fd，与 Looper 共享 epoll_wait ✓×1 (最近:2026-05-09，机制讲透)"
  - "[阶段5] Window/View/ViewRootImpl 三层创建时机：attach 创建 PhoneWindow → setContentView 创建 DecorView 树 → handleResumeActivity 调用 WindowManager.addView 创建 ViewRootImpl（不在 onResume 内）✓×1 (最近:2026-05-09，补全后掌握)"
  - "[阶段5] 渲染管线 ViewRootImpl 创建节点（onResume 返回后 WindowManager.addView）✓×1 (历史轮次答对，2026-05-09 复习仍记得)"
  - "[阶段5] Draw 步骤产出 DisplayList 而非直接 OpenGL 指令，RenderThread 才做翻译 ✓×1 (历史轮次答对，2026-05-09 复习仍记得)"
  - "[阶段5] SurfaceFlinger 合成层易遗漏 ✓×1 (历史轮次答对，2026-05-09 复习仍记得)"
  - "[阶段5] RenderThread 三角色分工：主线程录、RenderThread 翻译、GPU 执行 ✓×1 (历史轮次答对，2026-05-09 复习仍记得)"
