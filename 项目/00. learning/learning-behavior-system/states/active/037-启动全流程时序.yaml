  # ========== 阶段1：进程创建 ==========
  - "[阶段1] Binder 调用链具体 API：Activity.startActivity → Instrumentation.execStartActivity → ActivityTaskManager.getService().startActivity（Android 10+）。Instrumentation 是中间层，getService() 拿到的是 Binder 代理 ✓×1 (最近:2026-05-09，方法名精度仍待巩固)"
  - "[阶段1] ATMS vs AMS 职责边界：ATMS 管 Activity/Task 调度（Android 10+ 拆出来），AMS 管进程生命周期。拉新进程是 AMS 的活：ATMS 判断需要进程 → 回调 AMS.startProcessLocked → Process.start → ZygoteProcess → Socket。不要默认'ATMS 直接调 Zygote' ✓×1 (最近:2026-05-09)"
  - "[阶段1] Zygote 不开 Binder 的根因：①Binder 驱动状态绑定进程，fork 克隆会乱（用户态线程丢失但 fd 被继承导致内核态登记还在 → 账实不符）②多线程 fork 不安全，其他线程持有的锁被克隆进子进程永远不释放。不要停留在'多线程 fork 会死锁'的泛泛回答 ✓×1 (最近:2026-05-09)"
  - "[阶段1][❌易错] fork 返回值方向曾写反：=0 是子进程走 ActivityThread.main，>0 是父进程（Zygote）拿到子进程 pid，<0 失败。Linux fork 基础语义，面试写反扣分 ✓×1 (最近:2026-05-09)"
  - "[阶段1][❌易错] fork 后子进程精确顺序：先关 Zygote Server Socket fd → ZygoteInit.handleChildProc → 反射 ActivityThread.main。先关 fd，再进 main ✓×1 (最近:2026-05-09)"

  # ========== 阶段2：主线程建立 + 双向 Binder 通道 ==========
  - "[阶段2] main() 精确四步顺序：①Looper.prepareMainLooper ②new ActivityThread（同时字段初始化 ApplicationThread / mH）③attach(false) ④Looper.loop()。曾漏首尾两步 ✗ (2026-05-09 又漏 Looper.loop())"
  - "[阶段2] attach(false) 内部动作：getService 拿 AMS 代理 → attachApplication(mAppThread) 把 ApplicationThread 上交给 AMS ✗ (2026-05-09 用户声称记得，但答案中未明确说出 getService 这一步)"
  - "[阶段2] AMS 把 ApplicationThread 代理保存到对应的 ProcessRecord.thread 字段 ✓×1 (最近:2026-05-09)"
  - "[阶段2] ServiceManager（handle=0）是拿任何系统服务 Binder 的统一入口 (2026-05-09 跳过未答)"
  - "[阶段2][❌易错] AMS 端方法名是 attachApplication，不是 attach ✓×1 (最近:2026-05-09)"
  - "[阶段2][❌易错] 不要说成 application.attach —— 此时 Application 尚未创建，attach 是 ActivityThread 的方法"
  - "[阶段2][❌易错] ApplicationThread 和 mH 是 ActivityThread 的字段初始化产物，不是 main() 里单独的步骤"

  # ========== 阶段3：Application 初始化 ==========
  - "[阶段3] 术语：bindApplication / H.BIND_APPLICATION（不是 createApplication，严重术语错误）✓×1 (最近:2026-05-09)"
  - "[阶段3] Binder 线程池启动时机：在 native onZygoteInit 里，早于 ActivityThread.main()。不是'loop 之前' (2026-05-09 跳过未答)"
  - "[阶段3] 执行链精度：LoadedApk.makeApplication → Instrumentation.newApplication（反射） → Application.attach（包私有） → attachBaseContext（用户回调）✗ (2026-05-09 框架对但术语仍错为 loadApk)"
  - "[阶段3] ContentProvider 入口方法名：installContentProviders ✗ (2026-05-09 仍未主动说出方法名)"
  - "[阶段3] LoadedApk 抽象：持有 ClassLoader / Resources / ApplicationInfo / Application 实例。容易没主动提 ✗ (2026-05-09 仍说成 loadApk)"
  - "[阶段3][⚠️⚠️ 反复弱点] Instrumentation 角色定位：不是中转，是【ActivityThread 调用用户代码的统一入口】。所有'反射 new + 调用生命周期'都从它走（newApplication / newActivity / callActivityOnCreate/Start/Resume / callApplicationOnCreate）。Espresso、AndroidJUnitRunner 能拦截生命周期的根因 ⚠️ (2026-05-09 用户声明'不深究方法名细节'，仅概念理解到位)"

