notes: |
  学习来源：Android 启动优化模块 轮次2（Claude教授 + 用户推导校准）
  原始笔记：04. 学习_性能优化/启动优化_03.启动流程.md（16阶段，全部已推导校准）
  本卡覆盖：从用户点击图标到首帧上屏的完整链路

  ========== 一、进程创建链路 ==========
  Launcher → Binder → AMS/ATMS → socket → Zygote fork → App 进程

  Android 10 分家：ATMS 管 Activity/Task 栈，AMS 管进程创建和生命周期分发
  Zygote 预加载 ART + framework 类/库，fork 出的子进程直接继承，无需重做重量级初始化

  为什么 AMS→Zygote 用 socket 不用 Binder：
    1. Binder 驱动状态与进程绑定，fork 会克隆状态导致内核混乱
    2. 多线程 fork 不安全，其他线程持有的锁被克隆进子进程永远不释放
  策略：Zygote 一辈子不开 Binder，子进程自己初始化 Binder 线程池

  fork 返回值：0 = 子进程（新生儿），> 0 = 父进程持有的子 pid，< 0 = fork 失败
  ⚠️ 不要混淆 fork 返回值和 getpid()，子进程的真实 pid 要调 getpid() 才知道

  ========== 二、主线程建立 + 双向 Binder 通道 ==========
  Native 层先启动 Binder 线程池 → 反射调用 ActivityThread.main()

  ActivityThread.main() 三件事：
    1. Looper.prepareMainLooper()  ← 主线程消息循环
    2. new ActivityThread()        ← 同时 new ApplicationThread（字段初始化，不是 attach 时）
    3. thread.attach(false)        ← 向 AMS 报到，建立双向 Binder 通道
    4. Looper.loop()               ← 主线程进入死循环

  ⚠️ ActivityThread / ApplicationThread 都不是线程，是 Java 对象
  ⚠️ 代理永远在调用方，本体永远在被调用方

  attach() 核心：把 ApplicationThread（Binder stub）传给 AMS
    → AMS 持有 ApplicationThread 代理（可反向调 App）
    → App 持有 ActivityManager 代理（可主动调 AMS）
    → 双向 Binder 通道建立

  AMS 反向调 bindApplication：
    → Binder 线程池某线程被唤醒
    → ApplicationThread.bindApplication：封装 AppBindData，sendMessage(H.BIND_APPLICATION)
    → Binder 线程立刻释放
    → 主线程 Looper 取出消息，mH Handler 处理
  设计原因：Binder 线程池共 16 个，不能跑重活；生命周期必须串行在主线程

  ========== 三、Application 初始化序列 ==========
  主线程处理 BIND_APPLICATION 消息 → handleBindApplication：

  1. 进程身份设置：改进程名、时区、Locale（把 Zygote 克隆的信息换成 App 自己的）
  2. 创建 LoadedApk：持有 APK 路径 + PathClassLoader + Resources + Manifest 信息
     ⚠️ 只是准备好 ClassLoader，类未被加载；类加载是按需的，首次引用时才发生
  3. makeApplication：用 PathClassLoader 反射加载 Application 类 → 反射 new 实例（无参构造）
     → application.attach(context) → attachBaseContext()  ← 第一个生命周期回调，此后有 Context
     为什么必须反射：ActivityThread 是系统代码用系统 ClassLoader 加载，无法直接 new 你的 Application
  4. installContentProviders：对 Manifest 里每个 Provider 反射 new + 同步调用 onCreate()，全在主线程
  5. callApplicationOnCreate → Application.onCreate()

  ⚠️ ContentProvider.onCreate 先于 Application.onCreate（反常识！）
  系统原因：Provider 需要在应用未完全启动时也能被外部查询
  实际代价：第三方 SDK 夹带 Provider（FirebaseInitProvider / WorkManagerInitializer 等），
            悄悄在主线程串行消耗启动时间，审查命令：
            adb shell dumpsys package com.xx.app | grep -i provider

  ========== 四、Activity 启动 ==========
  LAUNCH_ACTIVITY 消息路径与 BIND_APPLICATION 完全一样（Binder线程→封装→主线程mH处理）

  performLaunchActivity 5 步：
    1. 创建 Activity 的 Context（ContextImpl）
    2. 反射 new Activity 实例（无参构造）
    3. Activity.attach()：绑定 Context + new PhoneWindow（Window 在此诞生，DecorView 还没有）
    4. setTheme（轻，可忽略）
    5. 调用 Activity.onCreate()

  setContentView 三阶段（在 onCreate 里执行）：
    1. installDecor：new DecorView + 选系统布局模板 + 找到 mContentParent(FrameLayout)
       层级：DecorView > 系统模板 > @android:id/content > 你的布局
    2. LayoutInflater.inflate：解析 XML → 对每个标签反射 new View → addView 构建层级
    3. 返回：View 树挂好，但没有任何 measure

  ⚠️ setContentView 不跑 measure，setContentView 之后 view.width = 0
  ⚠️ onCreate / onStart / onResume 在同一条 LAUNCH_ACTIVITY 消息里连续执行，
     中间 Looper 不取新消息 → onCreate 里 post 的任务要等 onResume 之后才跑

  ========== 五、渲染管线 ==========
  onResume 返回后，系统调 WindowManager.addView(decorView)
    → 创建 ViewRootImpl（View树与系统渲染的桥梁）
    → requestLayout() 向 Choreographer 注册 vsync 回调

  等下一个 vsync 信号（屏幕硬件每 16.6ms 发一次，Android 4.1 后应用端监听）
    → Choreographer 触发 ViewRootImpl.performTraversals()

  performTraversals 三步：
    1. performMeasure：递归 onMeasure()，父传约束，子算宽高
    2. performLayout：递归 onLayout()，确定每个 View 的四个坐标 ← view.width 到这里才不是 0
    3. performDraw：递归 onDraw()，但用记录型 Canvas，输出 DisplayList（绘制指令列表）
       ⚠️ 不是实际渲染像素，只是录制指令

  DisplayList → RenderThread：
    → 翻译成 OpenGL/Vulkan 命令 → GPU 渲染 → 写入 BufferQueue
    → SurfaceFlinger 在下一个 vsync 合成所有图层 → 推上屏幕

  ★ 首帧上屏 = TTID 终点
    WMS 收到首帧提交通知 → logcat 打印：
    "ActivityTaskManager: Displayed com.xx.app/.MainActivity: +XXXms"
    → Starting Window 被系统移除

  ⚠️ onResume ≠ 启动完成，onResume 只是"告诉系统可以绘制了"
     真正结束是：SurfaceFlinger 合成上屏 → WMS 打 Displayed 日志

  ========== 记忆锚点（2026-04-28）==========
  ① attach 生 Window，setContentView 生 DecorView，addView 生 ViewRootImpl
  ② 主线程录 DisplayList，RenderThread 翻译给 GPU，SurfaceFlinger 进程合成上屏
  ③ onResume 不是终点，WMS 打 Displayed 才是
