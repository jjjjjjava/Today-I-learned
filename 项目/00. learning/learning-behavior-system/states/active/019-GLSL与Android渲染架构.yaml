notes: |
  学习来源：04. 学习_音视频/03. 音视频_OpenGL_01.初步了解OpenGL ES.md
  对应章节：3.3 GLSL + 3.4代码架构

  GLSL三种变量：
    attribute = per-vertex输入，每顶点不同（位置/纹理坐标）
    uniform = 全局常量，顶点+片元都能读（矩阵/纹理采样器）
    varying = 桥梁，顶点写→光栅化插值→片元读

  着色器程序三阶段：
    A编译：createShader→shaderSource→compileShader（顶点+片元各一遍）
    B组装：createProgram→attachShader×2→linkProgram
    C使用：getAttribLocation/getUniformLocation（链接后）→useProgram

  Android四层架构：
    Activity→GLSurfaceView→SimpleRenderer→IDrawer→具体Drawer

  GLSurfaceView渲染模式：
    CONTINUOUSLY：while循环，eglSwapBuffers被VSync限速
    WHEN_DIRTY：wait→requestRender唤醒→draw→swap→wait

  易混淆（高频出错）：
    onFrameAvailable = SurfaceTexture回调（解码器写帧通知）
    onDrawFrame = Renderer回调（GL渲染节拍）
    两者通过flag桥接

