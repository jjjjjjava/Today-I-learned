  ## 下次复习重点考察
  - 状态机：stop()→Uninitialized（不是Configured）
  - 同步vs异步：onOutputFormatChanged + onError 这两个回调名
  - CSD：SPS=csd-0, PPS=csd-1（不是分辨率/码率）
  - 绿屏本质：YUV全零=绿色（不是RGB全零）
