notes: |
  CPU路径瓶颈：1080p 30fps → 90MB/s，三个问题：YUV→RGB CPU计算/内存分配/glTexImage2D拷贝
  零拷贝核心组件：
    - BufferQueue：内部3个GraphicBuffer（ION共享显存），producer/consumer
    - SurfaceTexture：持有consumer
    - Surface：包装producer，对外暴露ANativeWindow
    - MediaCodec.configure(format, surface)：拿到ANativeWindow，硬件解码直写GraphicBuffer
  关键机制：
    - updateTexImage()：必须在GL线程调用，取最新帧跳过积压旧帧
    - EGLImage：eglCreateImageKHR把GraphicBuffer包装成显存句柄（不拷贝）
    - glEGLImageTargetTexture2DOES：绑定到GL_TEXTURE_EXTERNAL_OES
    - GL_TEXTURE_EXTERNAL_OES vs GL_TEXTURE_2D：
        GL_TEXTURE_2D：数据由OpenGL自己管理，glTexImage2D上传到OpenGL管辖的显存，OpenGL拥有这块内存
        GL_TEXTURE_EXTERNAL_OES：数据在OpenGL外部（GraphicBuffer/ION共享显存），OpenGL只持有引用不拥有内存
        → 这就是"外部纹理"名称的由来，GLSL采样器也要用samplerExternalOES而非sampler2D
    - 硬件sampler自动完成YUV→RGB，不是shader手写
  完整数据流：视频文件→MediaCodec硬件解码→GraphicBuffer→BufferQueue→SurfaceTexture
              →updateTexImage→EGLImage→OES纹理→GPU shader→EGLSurface→SurfaceFlinger→屏幕

