notes: |
  MediaExtractor解封装 + MediaMuxer封装，数据全程不解码（H264/AAC直接搬运）
  核心流程：init(创建Extractor+Muxer, addTrack) → remux(循环read+write) → release(stop落盘moov box)
  重封装 vs 转码：重封装不经过解码，转码多了解码+编码两步
  MP4文件核心盒子结构：
    moov：目录（所有元数据）
    └── trak：轨道（视频轨/音频轨各一个）
        └── mdia：媒体信息
            └── minf：媒体详细信息
                └── stbl：帧映射表（每帧在mdat中的偏移量、大小、时间戳）
    mdat：数据仓库（实际的H264/AAC压缩数据，平铺存放）
  mdat中数据排列取决于写入方式：
    顺序写入：所有视频帧在前，音频帧在后，流式传输不友好
    交替写入：按时间交错排列，流式传输友好
