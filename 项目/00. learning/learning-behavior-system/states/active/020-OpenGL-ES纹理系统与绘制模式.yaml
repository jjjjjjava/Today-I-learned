notes: |
  学习来源：04. 学习_音视频/03. 音视频_OpenGL_01.初步了解OpenGL ES.md
  对应章节：3.3纹理基础 + 3.3使用纹理显示图片 + 3.5绘制模式
  前置：019-GLSL与Android渲染架构 学完后再学本条
  核心内容：
    1. 纹理三件套：
       - 纹理对象：GPU显存中存储的图像数据，用ID标识（glGenTextures）
       - 纹理单元：GPU工作插槽，允许着色器同时采样多纹理（glActiveTexture）
       - 纹理目标：插槽类型（GL_TEXTURE_2D / GL_TEXTURE_EXTERNAL_OES等）
    2. 纹理工作流程（5步）：
       glGenTextures → glActiveTexture → glBindTexture → 配置参数 → glTexImage2D
       ⚠️ 必须先Active再Bind，Bind永远作用于当前激活的纹理单元
    3. 绘制模式三种：
       - GL_TRIANGLES：每3个顶点独立三角形
       - GL_TRIANGLE_STRIP：复用前2顶点，四边形用4顶点（视频渲染标准）
       - GL_TRIANGLE_FAN：复用第一个顶点，适合扇形/圆形
    4. 顶点坐标和纹理坐标顺序必须一一对应，否则图像对角翻转
    5. OpenGL资源在GPU显存，不受GC管理，必须手动release
