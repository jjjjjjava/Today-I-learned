notes: |
  学习来源：04. 学习_音视频/03. 音视频_OpenGL_01.初步了解OpenGL ES.md
  对应章节：02核心概念 + 3.1坐标系 + 3.2GPU渲染流程
  核心内容：
    1. 为什么用GPU：1080p=207万像素，GPU 3000~10000+核心并行，CPU只有8~32核
    2. OpenGL ES：OpenGL的嵌入式子集，控制GPU执行渲染的API
    3. 三个坐标系：
       - Android屏幕坐标：左上角(0,0)，Y向下，像素单位
       - 世界坐标（顶点坐标）：中心(0,0)，Y向上，归一化[-1,1]
       - 纹理坐标：左下角(0,0)，范围[0,1]×[0,1]，Y向上（与NDC方向一致）
    4. GPU渲染流程6步：
       顶点处理→图元装配→光栅化（插值计算纹理坐标）→片元处理→测试与混合→写入帧缓冲
    5. 纹理本质：图像数据在GPU显存的存储形式，采样=按纹理坐标取色
    6. 光栅化插值：4个顶点建立对应关系，自动为三角形内百万像素插值出纹理坐标
