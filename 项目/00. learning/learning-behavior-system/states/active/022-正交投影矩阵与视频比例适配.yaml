notes: |
  学习来源：04. 学习_音视频/03. 音视频_OpenGL_02.使用OpenGL渲染视频画面.md
  对应章节：3.3视频比例拉伸_其一：原因及深入理解矩阵变换
  前置：018渲染管线基础（顶点坐标系） + 020纹理系统（三个坐标系）
  核心内容：
    1. 变形原因：
       - OpenGL NDC坐标[-1,1]直接映射到屏幕，不管视频原始比例，无脑拉伸铺满
       - 解决方案：通过正交投影矩阵控制缩放
    2. 4×4矩阵与齐次坐标：
       - 3×3矩阵能做缩放和旋转，但无法做平移（矩阵乘法无常数项）
       - 加第4维w=1，4×4矩阵最后一列乘以w=1产生加法，实现平移
       - 4×4矩阵一次乘法同时表达：缩放+旋转+平移
    3. orthoM本质：重新定义NDC到屏幕的映射关系
       - 默认：NDC[-1,1]映射到屏幕全部像素
       - orthoM(bottom=-3.555, top=3.555)：NDC[-3.555,3.555]映射到屏幕全部像素
       - 效果：画面还在[-1,1]，但NDC范围扩大了，画面只占28%
       - 不是缩放画面，而是扩大NDC范围，相对缩小画面
    4. orthoM矩阵结构（简化）：
       - X轴缩放 = 2/(right-left)
       - Y轴缩放 = 2/(top-bottom)
       - left=-1,right=1 → X缩放=1.0（不缩放）
       - bottom=-3.555,top=3.555 → Y缩放=2/7.11=0.28（缩小）
    5. 比例计算逻辑：
       - videoRatio = 视频宽/视频高
       - screenRatio = 屏幕宽/屏幕高
       - videoRatio > screenRatio → 视频更扁 → 宽度铺满，缩放高度（上下黑边）
       - videoRatio < screenRatio → 视频更高 → 高度铺满，缩放宽度（左右黑边）
       - actualRatio = 两个ratio相除，作为NDC扩大倍数
    6. 实际例子：1000×500视频在1080×1920屏幕
       - videoRatio=2.0, screenRatio=0.5625
       - actualRatio=2.0/0.5625=3.555
       - orthoM(-1,1,-3.555,3.555,-1,3) → Y轴缩小到28%
    7. 四种场景都适用同一逻辑：横屏+扁视频、横屏+高视频、竖屏+扁视频、竖屏+高视频

