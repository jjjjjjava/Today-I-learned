notes: |
  学习来源：00. learning/learning-behavior-system/code/生成一个MP4.md
  前置：021双Surface + 025多画面渲染 + 027深入理解EGL + 028FBO

  本文定位：系列终章，把 MediaCodec解码 + OpenGL渲染 + EGL + FBO + MMuxer 串成完整闭环

  2026-04-01 状态差，快速带看，未完整消化，放 pool 待后续激活。

  核心理解：
    两条流水线独立运行，在 MMuxer 汇合：
    - 视频：VideoDecoder → SurfaceTexture → OpenGL → EGL渲染到编码器Surface → MediaCodec自动编码
    - 音频：AudioDecoder → PCM帧 → AudioEncoder手动 queueInputBuffer → MediaCodec编码

  关键设计点：
    - 视频用 Surface 模式（createInputSurface），MediaCodec 自动取帧，CPU 不参与
    - 音频手动 queueInputBuffer 压 PCM 数据
    - 两个解码器都 withoutSync()，去掉音视频同步，最快速度跑完
    - EGL 改为 RENDER_WHEN_DIRTY，解码一帧触发一次渲染
    - swapBuffers 前必须 setTimestamp(pts)，否则编码时间线乱

