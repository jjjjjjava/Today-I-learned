  核心内容概要：
    A. FBO本质：离屏渲染，把颜色attachment挂GL_TEXTURE_2D，GPU内部切换指针（ns级），不经CPU
    B. FBO 5步API：createFBOTexture / createFrameBuffer / bindFBO / unbindFBO / deleteFBO
    C. 灵魂出窍双通道：每500ms快照写FBO纹理；每帧双纹理混合输出屏幕
    D. configFboViewport三要素：单位矩阵 + mReserveVertexCoors翻转 + viewport=视频尺寸
    E. 着色器双纹理混合：scale扩散 + alpha消散 + drawFbo flag控制渲染目标
